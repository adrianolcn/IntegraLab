version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: integralab-db
    restart: always
    environment:
      POSTGRES_USER: integralab
      POSTGRES_PASSWORD: integralab
      POSTGRES_DB: integralab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
