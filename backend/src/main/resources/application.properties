spring.application.name=IntegraLab

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/integralab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:integralab}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:integralab}
